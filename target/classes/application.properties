server.port=8080
spring.application.name=inventory-management

# --- PostgreSQL (local install) ---
# Create the database once, before first run:  createdb inventory_db
# (or in psql:  CREATE DATABASE inventory_db;)
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_db
spring.datasource.username=postgres
spring.datasource.password=Sadhvika@2005
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate creates/updates the tables from the @Entity classes on startup,
# and NEVER drops data - so history survives restarts, exactly what the
# "keep every record, even deleted products" requirement needs.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/api-docs
